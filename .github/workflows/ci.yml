name: Python 3.12 checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: make test
      - run: make verify
      - name: Validate saved quality evidence
        if: ${{ hashFiles('starter/evidence/evaluation/final.json') != '' }}
        run: make eval EVAL_ARGS='--check-result=evidence/evaluation/final.json --faithfulness-min=0.90'
      - name: Audit rubric evidence
        if: ${{ hashFiles('starter/WRITEUP.md') != '' }}
        run: uv run --no-project python scripts/audit_submission.py
